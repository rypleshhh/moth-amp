name: moth_amp
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  path_provider: ^2.1.6
  rust_lib_moth_amp:
    path: rust_builder
  smtc_windows: ^1.1.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  fonts:
    # IBM Plex Mono — SIL Open Font License 1.1 (assets/fonts/IBMPlexMono-OFL.txt)
    - family: PlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
