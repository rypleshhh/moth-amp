[package]
name = "moth-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["keyring-store"]
# Секреты в системном хранилище (Windows Credential Manager, macOS Keychain,
# Secret Service). На Android вместо него — файлы в приватной папке приложения.
keyring-store = ["dep:keyring"]

[dependencies]
keyring = { workspace = true, optional = true }
lofty.workspace = true
md5.workspace = true
reqwest.workspace = true
rusty-s3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
