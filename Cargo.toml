[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "app/rust"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
moth-core = { path = "crates/core" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
lofty = "0.25"
rusty-s3 = "0.10"
url = "2"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
md5 = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "fs"] }
